# Ambiente de desenvolvimento LOCAL (nao usar em producao na AWS)
# Sobe backend + frontend + Postgres com um unico comando: docker compose up
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dm_escape_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dm_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dm_escape_room
      DATABASE_SSL: "false"
      JWT_SECRET: segredo-de-desenvolvimento-trocar-em-producao
      JWT_EXPIRES_IN: 12h
      ALLOWED_EMAIL_DOMAIN: "@vocedm.com.br"
      ADMIN_EMAILS: giovanna.torres@vocedm.com.br
      FRONTEND_URL: "http://localhost:5173"
      EVENTO_DATA_INICIO: "2026-09-14T10:00:00-03:00"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dm_pgdata:
